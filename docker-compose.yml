name: oh-id

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oh-id-backend
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      - PORT=8050
      - DB_SCHEMA=oh_id
      - PYTHONPATH=/app
    ports:
      - "127.0.0.1:8050:8050"
    networks:
      - oh_id_net
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8050"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8050/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api/v1
    container_name: oh-id-frontend
    restart: unless-stopped
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=/api/v1
    ports:
      - "127.0.0.1:3040:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - oh_id_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  oh_id_net:
    name: oh_id_net
    driver: bridge
